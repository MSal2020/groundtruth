name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Make pytest available so the Python runner E2E runs (not skipped).
      # Go is preinstalled on the runner, so the Go E2E runs too. Non-fatal:
      # if either is unavailable the E2E test skips itself.
      - name: Install pytest
        run: python3 -m pip install --quiet pytest || true
      - run: npm test
      - name: groundtruth verifies itself
        run: node dist/cli.js --claim "tests pass and it compiles" --offline

  eval:
    name: eval (precision/recall must stay 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Exits non-zero if any corpus case regresses (FP or FN). The dep cases
      # hit the npm registry; packageExists() retries transient failures.
      # NOTE: the Swift cases skip here — ubuntu has no Swift toolchain. The
      # eval-swift job below is what actually covers them.
      - name: Run evaluation corpus
        run: node eval/run.mjs

  eval-swift:
    name: eval (Swift — the blind spot that shipped)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: swift --version
      # Swift claims were parsed but never verified for weeks because no runner
      # existed and no runner-less CI job could notice. This job is the guard.
      - name: Run evaluation corpus (Swift toolchain present)
        run: node eval/run.mjs
      - name: Swift unit tests
        run: node --import tsx --test test/swift.test.ts
